name: Windows hooks

# Evidence for the SessionStart hook on Windows, beside the Mac live gate. It runs the hook the way
# Codex runs commandWindows, with no login, so no credential is ever on a runner with pull request code.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the hook as Codex runs commandWindows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'plugin root with spaces\pstack'
          New-Item -ItemType Directory -Force (Split-Path $root) | Out-Null
          Copy-Item -Recurse plugins/pstack $root
          $expected = (Get-Content -Raw "$root\hooks\session-start-context.md").Replace("`r`n", "`n").TrimEnd()
          $hook = (Get-Content -Raw plugins/pstack/hooks/hooks.json | ConvertFrom-Json).hooks.SessionStart[0].hooks[0].commandWindows
          # Codex starts %COMSPEC% /C and passes the command line wrapped in one pair of quotes.
          function Invoke-Hook([string]$File, [string]$CommandLine, [string]$Path) {
            $info = [Diagnostics.ProcessStartInfo]::new($File, $CommandLine)
            $info.UseShellExecute = $false; $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true
            $info.Environment['PLUGIN_ROOT'] = $root; $info.Environment['PATH'] = $Path
            $process = [Diagnostics.Process]::Start($info)
            $stderr = $process.StandardError.ReadToEndAsync(); $stdout = $process.StandardOutput.ReadToEnd(); $process.WaitForExit()
            Write-Host "exit $($process.ExitCode); stderr: $($stderr.Result)"
            @{ Code = $process.ExitCode; Out = $stdout.Replace("`r`n", "`n").TrimEnd() }
          }
          $cmd = Join-Path $env:SystemRoot 'System32\cmd.exe'
          $cases = @(
            @{ Name = 'ordinary PATH'; File = $cmd; Line = "/C `"$hook`""; Path = $env:PATH; Pass = $true },
            @{ Name = 'System32-only PATH'; File = $cmd; Line = "/C `"$hook`""; Path = (Join-Path $env:SystemRoot 'System32'); Pass = $true },
            @{ Name = 'session-start with an empty PATH'; File = 'C:\Program Files\Git\usr\bin\bash.exe'; Line = "`"$root\hooks\session-start`""; Path = ''; Pass = $true },
            @{ Name = 'missing script'; File = $cmd; Line = "/C `"$($hook.Replace(' session-start', ' missing-script'))`""; Path = $env:PATH; Pass = $false }
          )
          $failed = 0
          foreach ($case in $cases) {
            $result = Invoke-Hook $case.File $case.Line $case.Path
            $ok = if ($case.Pass) { $result.Code -eq 0 -and $result.Out -eq $expected } else { $result.Code -ne 0 }
            Write-Host "$(if ($ok) { 'PASS' } else { 'FAIL' }): $($case.Name)"
            if (-not $ok) { $failed++ }
          }
          Remove-Item "$root\hooks\session-start-context.md"
          $result = Invoke-Hook $cmd "/C `"$hook`"" $env:PATH
          Write-Host "$(if ($result.Code -ne 0) { 'PASS' } else { $failed++; 'FAIL' }): missing context file"
          if ($failed) { exit 1 }
